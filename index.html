<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS da Longevidade - FQ5C</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div class="container">
    <header class="header">
        <div class="brand-top">GPS DA LONGEVIDADE</div>
        <div class="score-circle"><span id="total-pts">0</span><small>PONTOS</small></div>
        <div class="system-badge">SISTEMA FQ5C + OUTROS</div>
    </header>
    <nav class="nav">
        <button class="nav-btn active" id="tab-hoje" onclick="changeTab('hoje')">DIÁRIO</button>
        <button class="nav-btn" id="tab-mosaico" onclick="changeTab('mosaico')">MAPA</button>
        <button class="nav-btn" id="tab-info" onclick="changeTab('info')">SISTEMA</button>
    </nav>
    <main class="content">
        <section id="view-hoje">
            <div class="date-container">
                <label>DATA DE HOJE:</label>
                <input type="date" id="dataSel" class="date-input">
            </div>
            <div id="lista-corpo"></div>
        </section>
        <section id="view-mosaico" class="hidden">
            <h2 class="tab-title">Seu Mapa de Vitalidade</h2>
            <div class="mosaico-grid" id="mosaico-grid"></div>
        </section>
        <section id="view-info" class="hidden">
            <h2 class="tab-title">O Manifesto FQ5C</h2>
            <div id="manifesto-content"></div>
        </section>
    </main>
    <footer class="main-footer">© 2026 Ricardo de Faria Barros</footer>
</div>
<script src="script.js"></script>
</body>
</html>
